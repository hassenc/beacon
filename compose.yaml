name: beacon-community
services:
  db:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_USER: beacon
      POSTGRES_DB: beacon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup.sh first}
    volumes:
      - beacon_pg:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:55438:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beacon -d beacon"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  beacon:
    build: .
    environment:
      DATABASE_URL: postgres://beacon:${POSTGRES_PASSWORD}@db:5432/beacon?sslmode=disable
      BEACON_KEY: ${BEACON_KEY:?Run scripts/setup.sh first}
      BEACON_ADMIN_EMAIL: ${BEACON_ADMIN_EMAIL}
      BEACON_ADMIN_PASSWORD: ${BEACON_ADMIN_PASSWORD}
      BEACON_URL: ${BEACON_URL:-http://localhost:8787}
      BEACON_ORG: ${BEACON_ORG:-Beacon Evaluation}
      BEACON_SECURITY_EXPIRES: ${BEACON_SECURITY_EXPIRES}
      BEACON_DEV: "true"
      BEACON_LISTEN: 0.0.0.0:8787
    ports:
      - "127.0.0.1:8787:8787"
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m"]
    restart: unless-stopped
volumes:
  beacon_pg:
