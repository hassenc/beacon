<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Beacon vulnerability response workflow</title>
  <desc id="desc">Illustration of private report intake flowing to a team case record.</desc>
  <rect width="1200" height="630" fill="#f7f8f6"/>
  <rect x="52" y="52" width="1096" height="526" rx="28" fill="#fff" stroke="#d4dfdb" stroke-width="3"/>
  <text x="100" y="145" fill="#126b57" font-family="system-ui,sans-serif" font-size="24" font-weight="700" letter-spacing="4">OPEN-SOURCE · SELF-HOSTED · BETA</text>
  <text x="100" y="230" fill="#17233a" font-family="system-ui,sans-serif" font-size="58" font-weight="750">A clearer response to</text>
  <text x="100" y="302" fill="#126b57" font-family="system-ui,sans-serif" font-size="58" font-weight="750">vulnerability reports.</text>
  <rect x="100" y="366" width="425" height="142" rx="16" fill="#f7f8f6" stroke="#d4dfdb" stroke-width="2"/>
  <text x="130" y="415" fill="#126b57" font-family="system-ui,sans-serif" font-size="20" font-weight="700">PRIVATE INTAKE</text>
  <text x="130" y="460" fill="#17233a" font-family="system-ui,sans-serif" font-size="26" font-weight="650">Report received</text>
  <path d="M568 438h82m-22-22 22 22-22 22" fill="none" stroke="#126b57" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="695" y="366" width="405" height="142" rx="16" fill="#172b37"/>
  <text x="728" y="415" fill="#9bd4c0" font-family="system-ui,sans-serif" font-size="20" font-weight="700">TEAM RESPONSE</text>
  <text x="728" y="460" fill="#fff" font-family="system-ui,sans-serif" font-size="26" font-weight="650">One reviewable record</text>
</svg>
