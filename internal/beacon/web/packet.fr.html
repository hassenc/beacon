{{define "content"}}<section class="panel"><h1>Vérification du dossier CRA</h1><p>Seules les informations ci-dessous seront exportées. Les notes internes et l’identité du rapporteur sont exclues. Vérifiez le texte du signalement avant tout partage.</p><pre>{{.PacketJSON}}</pre><form method="post" action="/app/cases/{{.Case.Ref}}/packet"><input type="hidden" name="csrf" value="{{.CSRF}}"><input type="hidden" name="revision" value="{{.Case.Revision}}"><label class="checkbox"><input type="checkbox" name="confirm" value="yes" required>J’ai vérifié le dossier exact et les preuves sélectionnées pour le partage externe.</label>{{range .Case.Payload.Attachments}}<label class="checkbox"><input type="checkbox" name="evidence" value="{{.ID}}">Inclure {{.Name}} · {{.SHA256}}</label>{{end}}<button class="button">Exporter le dossier vérifié</button></form></section>{{end}}
