{{define "content"}}<section class="panel"><h1>CRA packet review</h1><p>Only the information below will be exported. Internal notes and reporter identity are excluded. Review the report text for sensitive content before sharing.</p><pre>{{.PacketJSON}}</pre><form method="post" action="/app/cases/{{.Case.Ref}}/packet"><input type="hidden" name="csrf" value="{{.CSRF}}"><input type="hidden" name="revision" value="{{.Case.Revision}}"><label class="checkbox"><input type="checkbox" name="confirm" value="yes" required>I reviewed the exact packet and selected evidence for external sharing.</label>{{range .Case.Payload.Attachments}}<label class="checkbox"><input type="checkbox" name="evidence" value="{{.ID}}">Include {{.Name}} · {{.SHA256}}</label>{{end}}<button class="button">Export reviewed packet</button></form></section>{{end}}
